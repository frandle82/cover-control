name: Release Please

# Release Please maintains a release PR from Conventional Commit titles. This
# workflow intentionally uses only GITHUB_TOKEN: no App, PAT, private key, or
# repository secret is required. Events created by GITHUB_TOKEN do not start
# other workflows, so the HACS archive is built and uploaded in this same run
# immediately after Release Please publishes a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released version
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verify released version
        if: steps.release.outputs.release_created == 'true'
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ steps.release.outputs.tag_name }}
        run: python scripts/verify_release.py

      - name: Build HACS archive
        if: steps.release.outputs.release_created == 'true'
        run: python scripts/build_release.py

      - name: Verify HACS archive
        if: steps.release.outputs.release_created == 'true'
        run: python scripts/verify_release.py --archive --skip-tag

      - name: Upload HACS archive
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" cover_control.zip --clobber -R "$REPOSITORY"
