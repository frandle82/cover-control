name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests (HA ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: minimum
            label: minimum 2025.3
            python: '3.13'
            test_package: pytest-homeassistant-custom-component
            test_package_version: 0.13.221
          - id: current
            label: current 2026.11
            python: '3.14'
            test_package: pytest-homeassistant
            test_package_version: 2026.11.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install ${{ matrix.test_package }}==${{ matrix.test_package_version }}
      - name: Show test versions
        run: |
          python --version
          python -c "from importlib.metadata import version; print(f'homeassistant={version(\"homeassistant\")}')"
          python -c "from importlib.metadata import version; print(f'${{ matrix.test_package }}={version(\"${{ matrix.test_package }}\")}')"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python files
        if: matrix.id == 'current'
        run: python -m compileall -q custom_components tests scripts

  release-bundle:
    name: Release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify source versions
        run: python scripts/verify_release.py --skip-tag
      - name: Build and verify archive
        run: |
          python scripts/build_release.py
          python scripts/verify_release.py --archive --skip-tag
